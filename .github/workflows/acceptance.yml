name: Lunar Lander acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flight-and-host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Standard-library game suite
        run: python -m unittest discover -s tests -v
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: 8e593794ab5dad308d8a3552198b7da35b852c6d
          path: .task/netbbs
      - name: Install pinned acceptance host
        run: python -m pip install ./.task/netbbs
      - name: Real native runtime acceptance
        run: python scripts/netbbs_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-terminal-${{ matrix.os }}
          path: .task/native-acceptance/*.ans
